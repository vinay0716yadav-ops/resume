name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: 🚀 Build, Test & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: 🔧 Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: 📦 Build Application with Maven
        run: mvn clean package

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build Docker Image
        run: |
          docker build \
            -t vinay916/resume-site:latest \
            -t vinay916/resume-site:${{ github.sha }} \
            .

      - name: 🚀 Push Docker Images
        run: |
          docker push vinay916/resume-site:latest
          docker push vinay916/resume-site:${{ github.sha }}

      - name: 📋 Generate GitHub Actions Step Summary
        run: |
          echo "### 🚀 Deployment Summary - Resume Site Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Hub Repo** | \`vinay916/resume-site\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA Tag** | \`vinay916/resume-site:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Latest Tag** | \`vinay916/resume-site:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | \`${{ github.actor }}\` via \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Pull command:** \`docker pull vinay916/resume-site:latest\`" >> $GITHUB_STEP_SUMMARY