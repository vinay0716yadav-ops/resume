version: '3.8'

services:
  resume-site:
    build:
      context: .
      dockerfile: Dockerfile
    image: vinay916/resume-site:latest
    container_name: resume-website
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
    networks:
      - resume-network

networks:
  resume-network:
    driver: bridge
